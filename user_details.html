<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<title>register</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>		
		<header>
			<div class="navbar">
				<h2>Calculate</h2>
					<nav>
						<ul>
							<li><a href=main.html>Home</a></li>
							<li><a href=register.html>BMI/BMR Calc</a></li>
							<li><a href=weighttrack.html>Weight Track</a></li>
							<li><a href=callorietrack.html>Callorie Track</a></li>
							<li><a href=foodlist.html>Food List</a></li>
						</ul>
					</nav>
			</div>			
		</header>
		<main>
			<div class="user-details">
				<h2>Please enter your details</h2>
				<form action="/bmibmr.html">
					<div class="name_box">
						<label for="fname">Name</label>
						<input type="text" id="fname" name="fname">
					</div>
					<div class="gender_box">
						<p>Gender</p>
						<input type="radio" id="male" name="gender" value="Male">
						<label for="male">Male</label>
						<input type="radio" id="female" name="gender" value="Female">
						<label for="female">Female</label><br>
					</div>
					<div class="ahw_box">
						<label for="age">Age</label>
						<input type="text" id="age" name="age"><br>
					
						<label for="height">Height</label>
						<input type="text" id="height" name="height"><br>
					
						<label for="weight">Weight</label>
						<input type="text" id="weight" name="weight"><br>
					</div>
					<div class="actlvl_box">
						<p>Activity Level</p>
						<input type="radio" id="lvl1" name="act_lvl" value="1.2">
						<label for="lvl1">Sedentary</label><br>
						<input type="radio" id="lvl2" name="act_lvl" value="1.375">
						<label for="lvl2">Light Excercise</label><br>
						<input type="radio" id="lvl3" name="act_lvl" value="1.55">
						<label for="lvl3">Moderate Excercise</label><br>
						<input type="radio" id="lvl4" name="act_lvl" value="1.725">
						<label for="lvl4">Very Sctive</label><br>
						<input type="radio" id="lvl5" name="act_lvl" value="1.9">
						<label for="lvl5">Super Active</label><br>
						<input type="submit" value="Submit"><br>
					</div>
					<div class="result_box">
						<label for="bmr_result">BMR</label><br>
						<input type="text" id="bmr_result" name="bmr_result"><br>
						
						<label for="bmi_result">BMI</label><br>
						<input type="text" id="bmi_result" name="bmi_result"><br>
					</div>
				</form>	
			</div>	
		</main>				
	</body>
</html>
