<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<title>register</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>		
		<header>
			<div class="navbar">
				<h2>Calculate</h2>
					<nav>
						<ul>
							<li><a href=main.html>Main</a></li>
							<li><a href=user_details.html>User Details</a></li>
							<li><a href=weighttrack.html>Weight Track</a></li>
							<li><a href=callorietrack.html>Callorie Track</a></li>
							<li><a href=foodlist.html>Food List</a></li>
						</ul>
					</nav>
			</div>			
		</header>
		<main>
			<div class="register-page">				
				<form action="/bmibmr.html">
					<h2>Please enter your details</h2>
						<div class="name_box">						
							<input type="text" placeholder="User Name" required>
						</div>
						
						<div class="password_box">						
							<input type="text" placeholder="Password" required>
						</div>
						
						<div class="email_box">						
							<input type="text" placeholder="@email" required>
						</div>
						
						<div class="gender_box">
							<p>Gender</p>
							<input type="radio" id="male" name="gender" value="Male">
							<label for="male">Male</label>
							<input type="radio" id="female" name="gender" value="Female">
							<label for="female">Female</label><br>
						</div>
						
						<div class="ahw_box">
							<input type="text" placeholder="Age" required>
						
							<input type="text" placeholder="Height" required>
						
							<input type="text" placeholder="Weight">
						</div>
						
						<div class="actlvl_box">
							<p>Activity Level</p>
							<input type="radio" id="lvl1" name="act_lvl" value="1.2">
							<label for="lvl1">Sedentary</label><br>
							<input type="radio" id="lvl2" name="act_lvl" value="1.375">
							<label for="lvl2">Light Excercise</label><br>
							<input type="radio" id="lvl3" name="act_lvl" value="1.55">
							<label for="lvl3">Moderate Excercise</label><br>
							<input type="radio" id="lvl4" name="act_lvl" value="1.725">
							<label for="lvl4">Very Sctive</label><br>
							<input type="radio" id="lvl5" name="act_lvl" value="1.9">
							<label for="lvl5">Super Active</label><br>							
						</div>
						
							<button type="submit" class="btn">Submit</button>						
				</form>	
			</div>
		</main>				
	</body>
</html>
